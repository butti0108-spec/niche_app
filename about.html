<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>事業者情報｜アーチデザイン工房</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #faf7ee;
        --surface: #fffdf7;
        --ink: #26221a;
        --ink-2: #5d574a;
        --ink-3: #6f695b;
        --line: #ddd2ba;
        --navy: #1d4e89;
        --navy-deep: #122a5c;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
        font-size: 1rem;
        line-height: 1.9;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 72px; }

      header.page-head { padding: 40px 0 6px; }
      .shop-line {
        border-bottom: 3px double var(--ink);
        padding-bottom: 10px;
        font-size: 14px; font-weight: 700; letter-spacing: .06em;
        color: var(--navy);
      }
      h1 {
        font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
        font-weight: 800; font-size: 1.5rem;
        line-height: 1.45; margin: 26px 0 14px; color: var(--navy-deep);
      }
      .lead { color: var(--ink-2); margin: 0 0 10px; }
      .lead a, section a { color: var(--navy); font-weight: 700; }

      /* ---------- operator info table: plain, bureaucratic by design ---------- */
      table.info { width: 100%; border-collapse: collapse; margin: 26px 0 6px; }
      table.info th, table.info td {
        text-align: left; vertical-align: top;
        padding: 12px 10px; border-bottom: 1px solid var(--line);
      }
      table.info tr:first-child th, table.info tr:first-child td { border-top: 1px solid var(--line); }
      table.info th { width: 7em; font-weight: 800; color: var(--navy-deep); white-space: nowrap; }
      table.info td a { color: var(--navy); font-weight: 700; overflow-wrap: anywhere; text-decoration: none; }

      .back { text-align: center; margin: 40px 0 0; }
      .back.back-top { text-align: left; margin: 22px 0 0; }
      .back a {
        display: inline-block; color: var(--navy); font-weight: 700; font-size: 14px;
        text-decoration: none; border: 1.5px solid var(--navy); border-radius: 999px;
        padding: 10px 26px; background: var(--surface);
      }
      footer {
        margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line);
        text-align: center; font-size: 14px; color: var(--ink-3); letter-spacing: .06em;
      }

      /* ---------- batch 7 (2026-10-29): fluid type + one-line guarantees ---------- */
      html { font-size: 16px; }
      .nw { white-space: nowrap; }
      /* back-top is a button, not an annotation: 16px + one line */
      .back.back-top a { font-size: 1rem; white-space: nowrap; }
      @media (max-width: 640px) {
        .back.back-top a { padding: 10px 14px; }
      }
      @media (max-width: 340px) {
        .back.back-top a { padding: 9px 4px; letter-spacing: -.03em; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page-head">
        <div class="shop-line">アーチデザイン工房 ― カスタムアプリ工房</div>
        <h1>事業者情報</h1>
        <p class="lead">当工房の事業者情報です。</p>
      </header>

      <div class="back back-top">
        <a href="index.html">業務アプリ制作のご案内へ戻る</a>
      </div>

      <table class="info">
        <tr>
          <th>屋号</th>
          <td>アーチデザイン工房</td>
        </tr>
        <tr>
          <th>運営者</th>
          <td>増渕 敦</td>
        </tr>
        <tr>
          <th>所在地</th>
          <td>神奈川県横浜市（詳しい住所は、ご請求があれば遅滞なくお知らせします）</td>
        </tr>
        <tr>
          <th>連絡先</th>
          <td><a href="mailto:atsushi.masubuchi.work@gmail.com?subject=%E6%A5%AD%E5%8B%99%E3%82%A2%E3%83%97%E3%83%AA%E3%81%AE%E3%81%94%E7%9B%B8%E8%AB%87">atsushi.masubuchi.work@gmail.com</a></td>
        </tr>
        <tr>
          <th>事業内容</th>
          <td>ホームページ制作／業務アプリ制作</td>
        </tr>
      </table>

      <div class="back">
        <a href="index.html">業務アプリ制作のご案内へ戻る</a>
      </div>

      <footer>アーチデザイン工房</footer>
    </div>
  </body>
</html>
